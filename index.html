:root[data-theme="light"]{--bg:#f3eee1;--panel:#fbf7ec;--ink:#241f2e;--mute:#6b6577;--gold:#8a6420;--line:#d6c9ab;--btn:#3b2a55;--btnt:#f4ecd8;--bad:#9a3b36;--sea:#cfd8d4;--land:#e4d9bd}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}

main{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:2rem;line-height:1.15;margin:0 0 4px;font-weight:500;background:linear-gradient(135deg,#e8c877 0%,#d2a24c 45%,#b5873a 80%,#e0b565 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold)}
h2{font-size:1.25rem;margin:26px 0 8px;font-weight:400;color:var(--gold)}
p{margin:0 0 10px}.mute{color:var(--mute);font-size:.95rem}
label{display:block;margin:12px 0 4px;font-size:.95rem;color:var(--mute)}
input,textarea,select{width:100%;padding:10px 12px;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px}
textarea{min-height:76px;resize:vertical}
button{font:inherit;cursor:pointer;padding:10px 16px;border-radius:6px;border:1px solid var(--btn);background:var(--btn);color:var(--btnt)}
button.alt{background:transparent;color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row>*{flex:1 1 auto}
.idea{display:flex;gap:8px;margin:14px 0 4px}.idea input{flex:1}.idea button{flex:0 0 auto}
.entry{border-left:3px solid var(--gold);padding:2px 0 2px 14px;margin:20px 0}
.entry.new{animation:turnIn .45s ease both}
@keyframes turnIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.entry.new{animation:none}}
.act{font-style:italic;color:var(--mute);font-size:.95rem}
.re{margin:8px 0 0;padding:0;list-style:none;font-size:.97rem}.re li{margin:3px 0}.re b{color:var(--gold);font-weight:400}
.note{font-size:.95rem;border-top:1px solid var(--line);margin-top:8px;padding-top:6px;color:var(--mute)}
details{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:14px 0}summary{cursor:pointer;color:var(--gold)}
.err{color:var(--bad);font-size:.95rem;min-height:1.4em}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 0;font-size:.9rem}.leg span{display:flex;align-items:center;gap:6px}.sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto}.bar{width:44px;height:5px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{flex:0 0 auto;padding:7px 12px;font-size:.95rem}
.leg button{padding:5px 9px;font-size:.9rem;display:flex;gap:6px;align-items:center}.me{color:var(--mute)}.them{margin-left:10px;border-left:2px solid var(--gold);padding-left:8px}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}.who{margin-left:auto;font-size:.9rem}.nav button{padding:7px 12px;font-size:.95rem}
.col{max-width:720px;margin:0 auto}
@supports not (-webkit-background-clip:text){h1{background:none;color:var(--gold)}}
.hero h1,.nav .bt{background:linear-gradient(135deg,#e8c877 0%,#d2a24c 45%,#b5873a 80%,#e0b565 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@supports not (-webkit-background-clip:text){.hero h1,.nav .bt{background:none}}
.hero{padding:30px 0 18px}.hero h1{font-size:2.7rem;line-height:1.05;margin:0 0 10px}.hero p{max-width:36ch;margin:0 0 6px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}.pills button{flex:0 0 auto;border-radius:999px;padding:6px 14px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.th{position:relative;aspect-ratio:8/5;background:var(--sea)}.th img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:8px;bottom:8px;background:rgba(13,12,20,.8);color:#ecebe6;font-size:.8rem;padding:2px 9px;border-radius:999px}
.bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}.bd h3{margin:0;font-size:1.15rem;font-weight:400}
.bd p{margin:0;font-size:.95rem;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bd .row{margin-top:auto;padding-top:6px}
.strip{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0 10px}.strip p{margin:0}
.chosen{box-shadow:0 0 0 3px rgba(210,162,76,.45)}
.chatbox{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel)}.chatbox p{margin:4px 0;font-size:.95rem}
.rel{border-collapse:separate;border-spacing:3px}
.book img{max-width:100%;height:auto}
.mapwrap{overflow:auto;max-height:75vh;border:1px solid var(--line);border-radius:8px;margin-top:8px}
@media print{:root{--bg:#fff;--ink:#000;--mute:#444;--panel:#fff;--line:#bbb}.nav,.noprint,.who{display:none!important}main{padding:0}}
.colw{max-width:1180px;margin:0 auto}
.pax{display:grid;gap:12px;margin-top:4px}
.mapwrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.mapwrap canvas{border:0!important;border-radius:0!important}
.hud{position:absolute;left:10px;top:10px;z-index:3;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;max-width:calc(100% - 20px)}
.hud b,.hud span{background:rgba(13,12,20,.8);color:#ecebe6;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 12px;font-size:.88rem;font-weight:400}
.hud b{color:#d2a24c}
.hud .pill{background:rgba(13,12,20,.8);color:#ecebe6;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 12px;font-size:.78rem;min-height:0;font-weight:400;letter-spacing:.02em;cursor:pointer}
.hud .pill:hover{border-color:rgba(210,162,76,.6);color:#d2a24c}
.morepanel{display:none}
.timebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.timebar button{padding:7px 14px;border-radius:999px;font-size:.92rem}
.composer{position:sticky;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 8px}
.composer label{position:absolute;left:-9999px}
.composer textarea{min-height:62px}.composer select{margin-bottom:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}.tabs button{flex:0 0 auto;border-radius:999px;padding:7px 14px;font-size:.92rem}
.tabp[hidden]{display:none}
.side details{margin:10px 0}
.chronside{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px 14px;margin-bottom:12px}
.chronside .entry{margin:8px 0}
.chronside details.entry>summary{padding:7px 0}
.chronside .row{justify-content:center}
@media(min-width:960px){
 .pax{grid-template-columns:minmax(0,1.7fr) minmax(340px,1fr);grid-template-areas:"banner banner" "map side" "composer side";align-items:start}
 .pbanner{grid-area:banner}.pmap{grid-area:map}.composer{grid-area:composer;position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.25);z-index:6;padding:10px 0 6px}
 .side{grid-area:side;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;padding-right:4px}
}
.live{font-style:italic;white-space:pre-wrap}

:root{--ff-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ff-title:"Cinzel","Trajan Pro",Georgia,serif;--ff-story:"IM Fell English",Georgia,serif;--r:14px;--r-lg:18px;--sh:0 10px 30px rgba(0,0,0,.35);--glass:rgba(13,12,20,.74)}
body{font:400 16px/1.6 var(--ff-ui);-webkit-font-smoothing:antialiased;background:radial-gradient(1100px 560px at 85% -8%,rgba(122,78,180,.2),transparent 62%),radial-gradient(900px 500px at -5% 105%,rgba(210,162,76,.08),transparent 60%),var(--bg);background-attachment:fixed}
::selection{background:rgba(210,162,76,.35)}
*{scrollbar-width:thin;scrollbar-color:#3b3852 transparent}
main{padding-top:14px}
h1,h2,h3{font-family:var(--ff-title);font-weight:600;letter-spacing:.03em}
h1{font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.15;color:var(--ink)}
h2{font-size:.92rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin:30px 0 12px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
label{font-size:.82rem;letter-spacing:.03em}
input,textarea,select{font:inherit;border-radius:12px;padding:11px 13px;background:rgba(255,255,255,.04);border:1px solid var(--line);transition:border-color .15s,box-shadow .15s}
input:hover,textarea:hover,select:hover{border-color:#4a4666}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(210,162,76,.22)}
button{font:600 .9rem/1.2 var(--ff-ui);letter-spacing:.01em;border-radius:12px;padding:10px 18px;min-height:42px;transition:transform .12s,filter .15s,box-shadow .15s,background .15s,border-color .15s}
button:not(.alt){background:linear-gradient(180deg,#e4bc6c,#c9953c);color:#1a1424;border:0;box-shadow:0 2px 0 rgba(0,0,0,.25),0 8px 18px rgba(201,149,60,.2)}
button:not(.alt):hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
button:not(.alt):active:not(:disabled){transform:translateY(0)}
button.alt{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink)}
button.alt:hover:not(:disabled){border-color:var(--gold);background:rgba(210,162,76,.09)}
button:disabled{opacity:.45;filter:saturate(.6)}
.nav{position:sticky;top:8px;z-index:30;gap:4px;padding:8px 10px;margin:0 0 18px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.nav button{background:transparent;border:0;box-shadow:none;color:var(--mute);padding:7px 13px;min-height:36px;border-radius:999px;font-size:.85rem}
.nav button:hover:not(:disabled){color:var(--ink);background:rgba(255,255,255,.07);transform:none;filter:none}
.nav button:not(.alt){background:rgba(210,162,76,.16);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(210,162,76,.38)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--ff-title);font-weight:700;letter-spacing:.09em;font-size:.82rem;color:var(--ink);margin:0 8px 0 4px;white-space:nowrap;text-transform:uppercase}
.brand svg{width:26px;height:26px;flex:0 0 auto}
.who{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.78rem}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;padding:48px 28px 36px;margin:4px 0 16px;background:radial-gradient(1.2px 1.2px at 12% 24%,rgba(255,255,255,.9) 50%,transparent 52%),radial-gradient(1px 1px at 28% 68%,rgba(255,255,255,.7) 50%,transparent 52%),radial-gradient(1.4px 1.4px at 46% 18%,rgba(255,255,255,.8) 50%,transparent 52%),radial-gradient(1px 1px at 63% 56%,rgba(255,255,255,.6) 50%,transparent 52%),radial-gradient(1.2px 1.2px at 74% 20%,rgba(255,255,255,.85) 50%,transparent 52%),radial-gradient(1px 1px at 90% 72%,rgba(255,255,255,.6) 50%,transparent 52%),radial-gradient(130% 150% at 90% -20%,rgba(122,78,180,.5),transparent 58%),radial-gradient(90% 120% at 0% 118%,rgba(210,162,76,.22),transparent 60%),var(--panel)}
.hero::after{content:"";position:absolute;right:-36px;top:-36px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f7edd2,#d9c79a 55%,#b99a5a);box-shadow:0 0 90px rgba(246,236,208,.28);-webkit-mask:radial-gradient(circle at 72% 44%,transparent 0 60%,#000 61%);mask:radial-gradient(circle at 72% 44%,transparent 0 60%,#000 61%);pointer-events:none}
.hero h1{position:relative;font-size:clamp(1.9rem,6.4vw,3.2rem);max-width:15ch;line-height:1.1;margin-bottom:12px}
.hero p{position:relative;font-size:1.02rem;max-width:44ch}
.hero .row{position:relative}
.strip{border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--panel);padding:12px 16px}
.pills{gap:8px}
.pills button{border-radius:999px;padding:7px 16px;min-height:36px;font-size:.84rem}
.pills button:not(.alt){background:rgba(210,162,76,.18);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(210,162,76,.5)}
.grid{gap:18px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.grid>*{animation:casc .5s ease both}
@keyframes casc{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.grid>*:nth-child(2){animation-delay:.06s}.grid>*:nth-child(3){animation-delay:.12s}.grid>*:nth-child(4){animation-delay:.18s}.grid>*:nth-child(5){animation-delay:.24s}.grid>*:nth-child(6){animation-delay:.3s}
.card{border-radius:18px;border:1px solid var(--line);background:var(--panel);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 24px rgba(0,0,0,.28);transition:transform .2s,box-shadow .2s,border-color .2s}
